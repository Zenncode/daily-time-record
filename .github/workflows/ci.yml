name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dtr?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/dtr?schema=public
      SESSION_SECRET: ci-only-session-secret-that-is-at-least-32-characters
      ADMIN_NAME: CI Administrator
      ADMIN_EMAIL: admin@dtr.com
      ADMIN_PASSWORD: 123456
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
