services:
  - type: web
    name: daily-time-record
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma migrate deploy && npm run db:seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: daily-time-record-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: daily-time-record-db
    databaseName: dtr
    user: dtr
    plan: basic-256mb
    region: singapore
